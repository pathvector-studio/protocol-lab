// Authoritative-only server for web.lab. (Lab 41: DNS round-robin).
// One name (web.lab.) has three A records; `rrset-order cyclic` makes the
// server rotate their order on each response, spreading clients across the
// three addresses.
options {
    directory "/var/cache/bind";
    recursion no;
    allow-query { any; };
    dnssec-validation no;
    listen-on { any; };
    listen-on-v6 { none; };
    minimal-responses no;
    // Rotate the order of records in an RRset on each answer (round-robin).
    rrset-order { order cyclic; };
};

logging {
    channel stderrlog {
        stderr;
        severity info;
        print-time yes;
        print-category yes;
    };
    category default { stderrlog; };
    category queries { stderrlog; };
};

zone "web.lab." {
    type master;
    file "/etc/bind/db.web.lab";
};
