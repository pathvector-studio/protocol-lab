// Validating recursive resolver for the example.lab island of trust (Lab 13).
//
// `dnssec-validation yes;` turns on validation using the trust anchors
// configured below. We are not under the real signed root, so we configure a
// static trust anchor for example.lab directly (its KSK / DNSKEY 257). Any
// answer for example.lab must carry RRSIGs that chain to this key, or the
// resolver marks it bogus and returns SERVFAIL.
//
// `zone example.lab { type static-stub; ... }` tells the resolver where the
// authoritative server lives (there is no signed root to delegate from), while
// still validating every answer it receives.
//
// The rndc control channel (key included from /etc/bind/rndc.key) lets run.sh
// flush the cache between the valid and the tampered query.
options {
    directory "/var/cache/bind";
    recursion yes;
    allow-recursion { any; };
    allow-query { any; };
    dnssec-validation yes;
    listen-on { any; };
    listen-on-v6 { none; };
    querylog yes;
};

logging {
    channel stderrlog { stderr; severity info; print-time yes; print-category yes; };
    category default { stderrlog; };
    category queries { stderrlog; };
    category dnssec { stderrlog; };
};

include "/etc/bind/rndc.key";
controls {
    inet 127.0.0.1 port 953 allow { 127.0.0.1; } keys { "rndc-key"; };
};

trust-anchors {
    "example.lab." static-key 257 3 13 "R1bxO3VeNTtONHDDf4LU7t0vkyFsusjPKo17XpJzQsmYPexmKGo2Br0x JBSOWRzRzK32vdLEbuoZbPMfolNB1w==";
};

zone "example.lab" {
    type static-stub;
    server-addresses { 10.0.1.2; };
};
