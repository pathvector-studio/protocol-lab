// Authoritative-only server for the signed example.lab zone (Lab 13).
//
// This node just serves the pre-signed zone (RRSIG/DNSKEY/NSEC records and
// all). It does not validate anything itself. The signed zone file is
// bind-mounted read-only at /etc/bind/db.example.lab.signed; run.sh copies it
// into the writable working directory below and reloads, so the bogus-answer
// demo can tamper with the served copy without touching the repo file.
options {
    directory "/var/cache/bind";
    recursion no;
    allow-query { any; };
    listen-on { any; };
    listen-on-v6 { none; };
    dnssec-validation no;
};

logging {
    channel stderrlog { stderr; severity info; print-time yes; print-category yes; };
    category default { stderrlog; };
    category queries { stderrlog; };
};

zone "example.lab" {
    type master;
    file "/var/cache/bind/db.example.lab.signed";
};
