// Split-horizon (views) server for app.lab. (Lab 42).
// The SAME name resolves differently depending on where the query came from:
// internal clients get the private address, everyone else gets the public one.
options {
    directory "/var/cache/bind";
    recursion no;
    allow-query { any; };
    dnssec-validation no;
    listen-on { any; };
    listen-on-v6 { none; };
    minimal-responses no;
};

logging {
    channel stderrlog {
        stderr;
        severity info;
        print-time yes;
        print-category yes;
    };
    category default { stderrlog; };
    category queries { stderrlog; };
};

// Views are matched top-down by the client's source address. The first view
// whose match-clients accepts the source wins.
view "internal" {
    match-clients { 10.0.1.0/24; };
    zone "app.lab." {
        type master;
        file "/etc/bind/db.internal";
    };
};

view "external" {
    match-clients { any; };
    zone "app.lab." {
        type master;
        file "/etc/bind/db.external";
    };
};
