frr version 10.0
frr defaults traditional
hostname server-b
service integrated-vtysh-config
!
router bgp 65002
 bgp router-id 10.22.22.22
 no bgp ebgp-requires-policy
 neighbor 10.0.2.1 remote-as 65000
 !
 address-family ipv4 unicast
  ! Announce the same anycast VIP as server-a.
  network 10.0.0.100/32
  ! Prepend our AS on the way out so our AS_PATH is longer than server-a's;
  ! r1 then prefers server-a while server-a is up. This makes server-a the
  ! "nearest" (preferred) instance and server-b the standby.
  neighbor 10.0.2.1 activate
  neighbor 10.0.2.1 route-map PREPEND out
 exit-address-family
!
route-map PREPEND permit 10
 set as-path prepend 65002 65002
!
line vty
