// Resolver + authoritative for example.lab (Lab 12).
// The client points its /etc/resolv.conf at this node.
options {
    directory "/var/cache/bind";
    recursion yes;
    allow-recursion { any; };
    allow-query { any; };
    dnssec-validation no;
    listen-on { any; };
    listen-on-v6 { none; };
};

logging {
    channel stderrlog { stderr; severity info; print-time yes; print-category yes; };
    category default { stderrlog; };
    category queries { stderrlog; };
};

zone "example.lab." {
    type master;
    file "/etc/bind/db.example.lab";
};
