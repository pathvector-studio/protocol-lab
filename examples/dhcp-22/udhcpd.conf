# Minimal DHCP server config for Lab 22 (busybox/udhcpd).
# Hands out addresses from 10.0.0.100-.200 on the server's eth1, and tells
# clients the router and lease time via DHCP options.
start           10.0.0.100
end             10.0.0.200
interface       eth1
option  subnet  255.255.255.0
option  router  10.0.0.1
option  dns     10.0.0.1
option  lease   3600
lease_file      /tmp/udhcpd.leases
