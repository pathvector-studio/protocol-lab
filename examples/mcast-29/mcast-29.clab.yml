name: mcast-29

# Multicast and IGMP: one sender, many receivers, one copy on the wire.
#
#            sender (10.0.0.1)
#                 |
#              [ sw ]  (Linux bridge: one shared segment)
#              /     \
#   rx1 (10.0.0.2)   rx2 (10.0.0.3)
#
# The sender sends UDP to the multicast group 239.1.1.1. Both receivers join the
# group (IGMP membership) and receive the same single stream — the sender does
# not send a separate copy per receiver. run.sh runs iperf as sender/receivers
# and captures the IGMP reports and the multicast frames.
#
# The sw node bridges its three interfaces (set up in exec). All nodes use
# netshoot. 10.0.0.0/24 is lab-only; 239.1.1.1 is an administratively-scoped
# multicast group.

topology:
  nodes:
    sender:
      kind: linux
      image: nicolaka/netshoot:latest
      cmd: "sleep infinity"
      # Pin multicast (239.0.0.0/8) to eth1 so it egresses onto the lab switch,
      # not the container's eth0 management bridge (which the default multicast
      # route would otherwise use). Without this the group is delivered over the
      # mgmt network and never crosses the sw node we want to observe.
      exec:
        - ip addr add 10.0.0.1/24 dev eth1
        - ip link set eth1 up
        - ip route add 239.0.0.0/8 dev eth1

    rx1:
      kind: linux
      image: nicolaka/netshoot:latest
      cmd: "sleep infinity"
      exec:
        - ip addr add 10.0.0.2/24 dev eth1
        - ip link set eth1 up
        - ip route add 239.0.0.0/8 dev eth1

    rx2:
      kind: linux
      image: nicolaka/netshoot:latest
      cmd: "sleep infinity"
      exec:
        - ip addr add 10.0.0.3/24 dev eth1
        - ip link set eth1 up
        - ip route add 239.0.0.0/8 dev eth1

    sw:
      kind: linux
      image: nicolaka/netshoot:latest
      cmd: "sleep infinity"
      # Bridge the three ports into one shared segment. Multicast snooping is
      # left off so the bridge floods the group to all ports (a plain hub-like
      # switch); IGMP membership is still visible as the receivers' signalling.
      exec:
        - ip link add name br0 type bridge
        - ip link set br0 type bridge mcast_snooping 0
        - ip link set eth1 master br0
        - ip link set eth2 master br0
        - ip link set eth3 master br0
        - ip link set eth1 up
        - ip link set eth2 up
        - ip link set eth3 up
        - ip link set br0 up

  links:
    - endpoints: ["sender:eth1", "sw:eth1"]
    - endpoints: ["rx1:eth1", "sw:eth2"]
    - endpoints: ["rx2:eth1", "sw:eth3"]
