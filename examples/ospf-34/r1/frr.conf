frr version 10.0
frr defaults traditional
hostname r1
service integrated-vtysh-config
!
! Explicit equal cost on both transit links so the SPF result is deterministic:
! r1 -> r3 direct = 10; r1 -> r2 -> r3 = 20. The direct link wins.
interface eth1
 ip ospf cost 10
 ip ospf network point-to-point
!
interface eth2
 ip ospf cost 10
 ip ospf network point-to-point
!
router ospf
 ospf router-id 1.1.1.1
 network 10.0.12.0/30 area 0
 network 10.0.13.0/30 area 0
!
line vty
