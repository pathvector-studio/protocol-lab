name: ospf-34

# OSPF: a link-state IGP forms adjacencies, computes shortest paths by cost,
# and reconverges when a link fails.
#
#            r1
#          /    \
#   (cost 10)   (cost 10)          target network 10.0.30.0/24 sits behind r3
#        /        \
#      r2 ---------r3 --- target (10.0.30.1)
#         (cost 10)
#
# All three routers run OSPF in area 0. r1 reaches the target behind r3 by the
# direct r1-r3 link (cost 10) rather than the two-hop r1-r2-r3 path (cost 20) —
# OSPF picks the lowest total cost. When the direct r1-r3 link fails, OSPF
# reconverges onto r1-r2-r3 and the target stays reachable at the same address.
#
# Contrast with BGP (Labs 01-04): BGP is a path-vector EGP that picks by policy/
# AS_PATH between autonomous systems; OSPF is a link-state IGP that floods link
# states inside one domain and runs Dijkstra (SPF) on the resulting map.
# 10.0.0.0/8 addressing is lab-only.

topology:
  nodes:
    r1:
      kind: linux
      image: frrouting/frr:latest
      binds:
        - ./r1/frr.conf:/etc/frr/frr.conf
        - ./r1/vtysh.conf:/etc/frr/vtysh.conf
        - ./r1/daemons:/etc/frr/daemons
      exec:
        - ip addr add 10.0.12.1/30 dev eth1
        - ip link set eth1 up
        - ip addr add 10.0.13.1/30 dev eth2
        - ip link set eth2 up
        - sysctl -w net.ipv4.ip_forward=1

    r2:
      kind: linux
      image: frrouting/frr:latest
      binds:
        - ./r2/frr.conf:/etc/frr/frr.conf
        - ./r2/vtysh.conf:/etc/frr/vtysh.conf
        - ./r2/daemons:/etc/frr/daemons
      exec:
        - ip addr add 10.0.12.2/30 dev eth1
        - ip link set eth1 up
        - ip addr add 10.0.23.1/30 dev eth2
        - ip link set eth2 up
        - sysctl -w net.ipv4.ip_forward=1

    r3:
      kind: linux
      image: frrouting/frr:latest
      binds:
        - ./r3/frr.conf:/etc/frr/frr.conf
        - ./r3/vtysh.conf:/etc/frr/vtysh.conf
        - ./r3/daemons:/etc/frr/daemons
      exec:
        - ip addr add 10.0.13.2/30 dev eth1
        - ip link set eth1 up
        - ip addr add 10.0.23.2/30 dev eth2
        - ip link set eth2 up
        - ip addr add 10.0.30.254/24 dev eth3
        - ip link set eth3 up
        - sysctl -w net.ipv4.ip_forward=1

    target:
      kind: linux
      image: nicolaka/netshoot:latest
      cmd: "sleep infinity"
      exec:
        - ip addr add 10.0.30.1/24 dev eth1
        - ip link set eth1 up
        - ip route replace default via 10.0.30.254

  links:
    - endpoints: ["r1:eth1", "r2:eth1"]   # r1-r2  10.0.12.0/30
    - endpoints: ["r1:eth2", "r3:eth1"]   # r1-r3  10.0.13.0/30 (direct)
    - endpoints: ["r2:eth2", "r3:eth2"]   # r2-r3  10.0.23.0/30
    - endpoints: ["r3:eth3", "target:eth1"]
