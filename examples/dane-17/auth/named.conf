// Authoritative server for the DNSSEC-signed example.lab (Lab 17, DANE).
//
// The zone carries a TLSA record for _443._tcp.www.example.lab that pins the
// web server's certificate. run.sh generates the web cert, computes the TLSA,
// writes the zone, signs it, and delivers the signed file into the writable
// working dir below (so nothing is committed and the TLSA always matches the
// freshly generated cert).
options {
    directory "/var/cache/bind";
    recursion no;
    allow-query { any; };
    dnssec-validation no;
    listen-on { any; };
    listen-on-v6 { none; };
};

logging {
    channel stderrlog { stderr; severity info; print-time yes; print-category yes; };
    category default { stderrlog; };
    category queries { stderrlog; };
};

zone "example.lab" {
    type master;
    file "/var/cache/bind/db.example.lab.signed";
};
