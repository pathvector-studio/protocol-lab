frr version 10.0
frr defaults traditional
hostname r2
service integrated-vtysh-config
!
interface eth1
 ip ospf cost 10
 ip ospf network point-to-point
 ip ospf bfd
!
interface eth2
 ip ospf cost 10
 ip ospf network point-to-point
 ip ospf bfd
!
router ospf
 ospf router-id 2.2.2.2
 network 10.0.12.0/30 area 0
 network 10.0.23.0/30 area 0
!
line vty
