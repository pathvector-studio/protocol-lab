frr version 10.0
frr defaults traditional
hostname r3
service integrated-vtysh-config
!
interface eth1
 ip ospf cost 10
 ip ospf network point-to-point
 ip ospf bfd
!
interface eth2
 ip ospf cost 10
 ip ospf network point-to-point
 ip ospf bfd
!
! The target segment carries no OSPF routers, so make it passive: advertise the
! 10.0.30.0/24 network but send no hellos onto it.
interface eth3
 ip ospf passive
!
router ospf
 ospf router-id 3.3.3.3
 network 10.0.13.0/30 area 0
 network 10.0.23.0/30 area 0
 network 10.0.30.0/24 area 0
!
line vty
