name: dns-06

# A small, self-contained DNS hierarchy for observing caching, TTL, and
# negative answers. Same shape as Lab 05, reused so you can focus on how
# answers are cached and expire rather than on the delegation walk.
#
#   client ---- resolver ----+---- root  (serves ".", delegates lab.)
#            (recursive)      +---- tld   (serves "lab.", delegates example.lab.)
#                             +---- auth  (serves "example.lab.", holds the A record)
#
# The resolver is the hub: it reaches every authoritative server directly and
# forwards the client's dig +trace packets. root/tld/auth do not talk to each
# other; the resolver (or the client in +trace mode) queries each in turn.
#
# 203.0.113.0/24 is RFC 5737 documentation space. Closed lab use only.

topology:
  nodes:
    root:
      kind: linux
      image: internetsystemsconsortium/bind9:9.20
      cmd: "-4 -g -c /etc/bind/named.conf"
      binds:
        - ./root/named.conf:/etc/bind/named.conf
        - ./root/db.root:/etc/bind/db.root
      exec:
        - ip addr add 10.0.1.2/24 dev eth1
        - ip link set eth1 up
        - ip route add 10.0.0.0/24 via 10.0.1.1

    tld:
      kind: linux
      image: internetsystemsconsortium/bind9:9.20
      cmd: "-4 -g -c /etc/bind/named.conf"
      binds:
        - ./tld/named.conf:/etc/bind/named.conf
        - ./tld/db.lab:/etc/bind/db.lab
      exec:
        - ip addr add 10.0.2.2/24 dev eth1
        - ip link set eth1 up
        - ip route add 10.0.0.0/24 via 10.0.2.1

    auth:
      kind: linux
      image: internetsystemsconsortium/bind9:9.20
      cmd: "-4 -g -c /etc/bind/named.conf"
      binds:
        - ./auth/named.conf:/etc/bind/named.conf
        - ./auth/db.example.lab:/etc/bind/db.example.lab
      exec:
        - ip addr add 10.0.3.2/24 dev eth1
        - ip link set eth1 up
        - ip route add 10.0.0.0/24 via 10.0.3.1

    resolver:
      kind: linux
      image: internetsystemsconsortium/bind9:9.20
      cmd: "-4 -g -c /etc/bind/named.conf"
      binds:
        - ./resolver/named.conf:/etc/bind/named.conf
        - ./resolver/root.hints:/etc/bind/root.hints
      exec:
        - ip addr add 10.0.0.1/24 dev eth1
        - ip link set eth1 up
        - ip addr add 10.0.1.1/24 dev eth2
        - ip link set eth2 up
        - ip addr add 10.0.2.1/24 dev eth3
        - ip link set eth3 up
        - ip addr add 10.0.3.1/24 dev eth4
        - ip link set eth4 up
        - sysctl -w net.ipv4.ip_forward=1

    client:
      kind: linux
      image: nicolaka/netshoot:latest
      cmd: "sleep infinity"
      exec:
        - ip addr add 10.0.0.2/24 dev eth1
        - ip link set eth1 up
        - ip route add default via 10.0.0.1

  links:
    - endpoints: ["client:eth1", "resolver:eth1"]
    - endpoints: ["resolver:eth2", "root:eth1"]
    - endpoints: ["resolver:eth3", "tld:eth1"]
    - endpoints: ["resolver:eth4", "auth:eth1"]
