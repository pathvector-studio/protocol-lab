// Recursive resolver config (Lab 05).
// This node performs iterative resolution on behalf of the client:
// root -> lab. -> example.lab. -> answer, then caches the result.
options {
    directory "/var/cache/bind";
    recursion yes;
    allow-recursion { any; };
    allow-query { any; };
    // Our fake hierarchy is unsigned and has no trust anchor.
    dnssec-validation no;
    listen-on { any; };
    listen-on-v6 { none; };
    // Log every query the resolver receives so the client's request is visible.
    querylog yes;
};

logging {
    channel stderrlog {
        stderr;
        severity info;
        print-time yes;
        print-category yes;
    };
    category default { stderrlog; };
    category queries { stderrlog; };
};

// Start iteration from our local fake root instead of the real Internet root.
zone "." {
    type hint;
    file "/etc/bind/root.hints";
};
