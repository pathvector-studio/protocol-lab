frr version 10.0
frr defaults traditional
hostname r1
service integrated-vtysh-config
!
router bgp 65001
 bgp router-id 10.0.9.1
 no bgp ebgp-requires-policy
 ! Two eBGP sessions to r2, one per parallel link.
 neighbor 10.0.12.2 remote-as 65002
 neighbor 10.0.13.2 remote-as 65002
 !
 address-family ipv4 unicast
  network 10.0.9.0/24
  neighbor 10.0.12.2 activate
  neighbor 10.0.13.2 activate
  ! Install both equal-cost eBGP paths (ECMP) instead of just one best path.
  maximum-paths 2
 exit-address-family
!
line vty
