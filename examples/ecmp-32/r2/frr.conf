frr version 10.0
frr defaults traditional
hostname r2
service integrated-vtysh-config
!
router bgp 65002
 bgp router-id 10.0.8.1
 no bgp ebgp-requires-policy
 ! Two eBGP sessions to r1, one per parallel link.
 neighbor 10.0.12.1 remote-as 65001
 neighbor 10.0.13.1 remote-as 65001
 !
 address-family ipv4 unicast
  network 10.0.8.0/24
  neighbor 10.0.12.1 activate
  neighbor 10.0.13.1 activate
  ! Install both equal-cost paths so the return traffic is also ECMP.
  maximum-paths 2
 exit-address-family
!
line vty
