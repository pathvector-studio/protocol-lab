// Authoritative server for example.lab, reachable three ways (Lab 14):
//   - Do53  : plaintext DNS on UDP/TCP port 53   (the classic transport)
//   - DoT   : DNS over TLS on port 853            (RFC 7858)
//   - DoH   : DNS over HTTPS on port 443, /dns-query (RFC 8484)
//
// DoT and DoH both wrap the same DNS messages in TLS, so an on-path observer
// sees a TLS handshake but not the query name. The TLS certificate is a
// self-signed cert for dns.example.lab, generated by run.sh into ./server/tls
// and bind-mounted below.
tls local-tls {
    cert-file "/etc/bind/tls/server.crt";
    key-file "/etc/bind/tls/server.key";
};

options {
    directory "/var/cache/bind";
    recursion no;
    allow-query { any; };
    dnssec-validation no;
    listen-on-v6 { none; };

    // Do53: plaintext.
    listen-on port 53 { any; };
    // DoT: DNS over TLS.
    listen-on port 853 tls local-tls { any; };
    // DoH: DNS over HTTPS (default http path is /dns-query).
    listen-on port 443 tls local-tls http default { any; };
};

logging {
    channel stderrlog { stderr; severity info; print-time yes; print-category yes; };
    category default { stderrlog; };
    category queries { stderrlog; };
};

zone "example.lab" {
    type master;
    file "/etc/bind/db.example.lab";
};
