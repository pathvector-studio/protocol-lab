name: dns-14

# Encrypted DNS: the same answer over Do53, DoT, and DoH.
#
#   client ---- eth1 ---- server (10.0.0.2)
#   (dig,               BIND: Do53 :53, DoT :853, DoH :443
#    dig +tls,          serves example.lab
#    dig +https)
#
# The point is what an on-path observer can read: on port 53 the query name is
# cleartext; on 853/443 it is inside TLS. run.sh captures each transport.
#
# The TLS cert (self-signed for dns.example.lab) is generated by run.sh into
# ./server/tls/ (gitignored) before deploy and bind-mounted read-only.
# 203.0.113.0/24 is RFC 5737 documentation space.

topology:
  nodes:
    client:
      kind: linux
      image: nicolaka/netshoot:latest
      cmd: "sleep infinity"
      exec:
        - ip addr add 10.0.0.1/24 dev eth1
        - ip link set eth1 up

    server:
      kind: linux
      image: protocol-lab/bind9:9.20
      binds:
        - ./server/named.conf:/etc/bind/named.conf
        - ./server/db.example.lab:/etc/bind/db.example.lab
        - ./server/tls/server.crt:/etc/bind/tls/server.crt
        - ./server/tls/server.key:/etc/bind/tls/server.key
      exec:
        - ip addr add 10.0.0.2/24 dev eth1
        - ip link set eth1 up

  links:
    - endpoints: ["client:eth1", "server:eth1"]
